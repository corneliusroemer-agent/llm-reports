# Builds mosquito-alert/live-map (React + Vite) and deploys it to GitHub Pages
# with a fresh data snapshot. The browser fills the gap since the snapshot with
# live API updates through a CORS proxy.
name: Mosquito Alert live map

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Force a full re-sync from the API"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "mosquito-alert/live-map/**"
      - ".github/workflows/mosquito-alert-map.yml"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # prune old state caches

concurrency:
  group: mosquito-alert-map
  cancel-in-progress: false

defaults:
  run:
    working-directory: mosquito-alert/live-map

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}mosquito-alert/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mosquito-alert/live-map/package-lock.json

      - run: npm ci

      - name: Build app
        env:
          # optional: extra CORS proxy templates tried first, e.g. https://example.com/?url={url}
          VITE_CORS_PROXY: ${{ vars.CORS_PROXY }}
        run: npm run build

      - name: Restore sync state
        uses: actions/cache/restore@v4
        with:
          path: mosquito-alert/live-map/.cache/state.json.gz
          key: ma-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ma-state-

      - name: Fetch data snapshot from Mosquito Alert API
        run: |
          mkdir -p .cache
          python3 fetch.py --state .cache/state.json.gz --out dist/data ${{ inputs.full && '--full' || '' }}

      - name: Save sync state
        uses: actions/cache/save@v4
        with:
          path: mosquito-alert/live-map/.cache/state.json.gz
          key: ma-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prune old state caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ma-state-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key ma-state- --limit 100 --json key --jq '.[].key' \
            | grep -vx "$KEEP" | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"

      - name: Assemble site
        run: |
          mkdir -p ../../_site
          cp -r dist ../../_site/mosquito-alert
          cat > ../../_site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=mosquito-alert/">
          <title>Redirecting…</title><a href="mosquito-alert/">Mosquito Alert live map</a>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
